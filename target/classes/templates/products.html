<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BUYSELL</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 10px 10px;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .product-price {
            color: #28a745;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .form-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-top: 2rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0.7rem 2rem;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
            transform: translateY(-2px);
        }
        .city-badge {
            background-color: #e9ecef;
            color: #495057;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="header text-center">
    <div class="container">
        <h1>Online-shop</h1>
        <p class="lead">Товары со всей России</p>
    </div>
</div>

<div class="container">

    <div th:if="${products != null and !products.empty}">
        <h3 class="mb-4">Актуальные объявления</h3>
        <div th:each="product : ${products}">
            <div class="product-card">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 th:text="${product.title}">Название товара</h5>
                        <p class="text-muted mb-1" th:text="${product.description}">Описание товара</p>
                        <span class="city-badge" th:text="${product.city}">Город</span>
                        <span class="text-muted ms-2">от</span>
                        <span class="author-name" th:text="${product.author}">Автор</span>
                    </div>
                    <div class="text-end">
                        <div class="product-price" th:text="${product.price} + ' руб.'">0 руб.</div>
                        <a th:href="@{/product/{id}(id=${product.id})}" class="btn btn-outline-primary btn-sm mt-2">Подробнее</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${products == null or products.empty}" class="text-center py-5">
        <h4>Объявлений пока нет</h4>
        <p class="text-muted">Будьте первым, кто разместит объявление!</p>
    </div>

    <hr class="my-5">


    <div class="form-container">
        <h3 class="mb-4">Создать новое объявление</h3>
        <form th:action="@{/product/create}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="title" class="form-label">Название объявления</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="price" class="form-label">Цена (руб.)</label>
                    <input type="number" class="form-control" id="price" name="price" min="0" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Описание объявления</label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="city" class="form-label">Город</label>
                    <input type="text" class="form-control" id="city" name="city" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="author" class="form-label">Ваше имя</label>
                    <input type="text" class="form-control" id="author" name="author" required>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Добавить товар</button>
            </div>
        </form>
    </div>
</div>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
        <p>Online-shop &copy; 2025. Все права защищены.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
